<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OGHOST - Hosting Billing</title>
<link rel="icon" href="assets/favicon.ico">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 font-family:Arial,sans-serif;
 background:#f4f6fb;
 color:#172033;
}

header{
 background:white;
 padding:18px 7%;
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #e5e7eb;
}

.logo{font-size:27px;font-weight:900;color:#e53945}
.logo span{color:#2364df}

nav a{
 text-decoration:none;
 color:#333;
 margin-left:22px;
 font-size:14px;
}

.hero{
 padding:75px 8%;
 background:linear-gradient(120deg,#142b55,#2465df);
 color:white;
}

.hero h1{font-size:42px;margin-bottom:15px}
.hero p{margin-bottom:25px;opacity:.9}

.hero button{
 background:white;
 color:#e53945;
 border:0;
 padding:13px 22px;
 border-radius:7px;
 font-weight:bold;
 cursor:pointer;
}

.container{padding:50px 8%}

.heading{text-align:center;margin-bottom:40px}
.heading h2{font-size:30px;margin-bottom:10px}

.category{margin-bottom:45px}

.category-title{
 display:flex;
 align-items:center;
 gap:12px;
 margin-bottom:20px;
}

.category-title:before{
 content:"";
 width:5px;
 height:27px;
 background:#e53945;
 border-radius:5px;
}

.category-title h2{font-size:24px}

.products{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
 gap:20px;
}

.product{
 background:white;
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:24px;
 box-shadow:0 5px 20px #00000008;
 transition:.2s;
}

.product:hover{
 transform:translateY(-4px);
 box-shadow:0 10px 25px #00000012;
}

.product h3{font-size:21px;margin-bottom:15px}

.specs{
 color:#687386;
 line-height:2;
 font-size:14px;
 margin-bottom:18px;
}

.price{
 color:#2364df;
 font-size:28px;
 font-weight:bold;
 margin-bottom:18px;
}

.price small{
 font-size:13px;
 color:#687386;
 font-weight:normal;
}

.product a{
 display:block;
 text-align:center;
 text-decoration:none;
 background:#e53945;
 color:white;
 padding:12px;
 border-radius:7px;
 font-weight:bold;
}

.product a:hover{background:#c92735}

.status{
 text-align:center;
 padding:25px;
 color:#687386;
}

.error{
 background:#fff0f0;
 border:1px solid #ffcaca;
 color:#b42318;
 padding:18px;
 border-radius:9px;
 line-height:1.6;
 overflow-wrap:anywhere;
}

footer{
 text-align:center;
 padding:30px;
 background:#101d35;
 color:#cbd5e1;
 font-size:13px;
}

footer p{margin:7px}

@media(max-width:600px){
 header{padding:15px 5%}
 nav a{margin-left:10px;font-size:12px}
 .logo{font-size:23px}
 .hero{padding:55px 6%}
 .hero h1{font-size:32px}
 .container{padding:35px 6%}
 .category-title h2{font-size:21px}
}
</style>
</head>

<body>

<header>
 <div class="logo">OG<span>HOST</span></div>
 <nav>
  <a href="#home">Home</a>
  <a href="#products">Plans</a>
  <a href="#contact">Contact</a>
 </nav>
</header>

<section class="hero" id="home">
 <h1>Welcome to OGHOST</h1>
 <p>Powerful hosting. Reliable performance. Affordable pricing.</p>
 <button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">
  Explore Hosting Plans
 </button>
</section>

<section class="container" id="products">
 <div class="heading">
  <h2>Our Hosting Products</h2>
  <p>Choose your preferred server and hosting plan.</p>
 </div>

 <div id="productList" class="status">
  Loading hosting plans...
 </div>
</section>

<footer id="contact">
 <p>© 2026 OGHOST. All rights reserved.</p>
 <p>Powered by SHIVAMBROOG</p>
</footer>

<script>
const PRODUCT_FILE = "./products.json";

function safeText(value){
 return String(value ?? "");
}

function escapeHTML(value){
 return safeText(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[c]));
}

function showError(message){
 const container=document.getElementById("productList");
 container.innerHTML="";

 const box=document.createElement("div");
 box.className="error";
 box.textContent="Unable to load hosting plans: "+message;

 container.appendChild(box);
}

function createPlanCard(plan){

 const card=document.createElement("div");
 card.className="product";

 const title=document.createElement("h3");
 title.textContent=safeText(plan.name);

 const specs=document.createElement("div");
 specs.className="specs";

 specs.innerHTML=`
  RAM: ${escapeHTML(plan.ram)}<br>
  CPU: ${escapeHTML(plan.cpu)}<br>
  Storage: ${escapeHTML(plan.storage)}
 `;

 const price=document.createElement("div");
 price.className="price";

 const amount=Number(plan.price);

 price.textContent=Number.isFinite(amount)
  ? "₹"+amount.toLocaleString("en-IN")+" / Month"
  : "Price unavailable";

 const link=document.createElement("a");

 const file=safeText(plan.file);

 if(file && !file.startsWith("/") && !file.includes("..")){
  link.href=file;
 }else{
  link.href="#";
 }

 link.textContent="View Plan";

 card.append(title,specs,price,link);

 return card;
}

async function loadProducts(){

 const container=document.getElementById("productList");

 try{

  const url=PRODUCT_FILE+"?v="+Date.now();

  const response=await fetch(url,{
   cache:"no-store"
  });

  if(!response.ok){
   throw new Error(
    "HTTP "+response.status+" - products.json not found"
   );
  }

  const raw=await response.text();

  let categories;

  try{
   categories=JSON.parse(raw);
  }catch(error){
   throw new Error("Invalid JSON: "+error.message);
  }

  if(!Array.isArray(categories)){
   throw new Error("JSON must contain an array of categories.");
  }

  container.innerHTML="";

  let totalPlans=0;

  categories.forEach(category=>{

   if(!category || !Array.isArray(category.plans)){
    return;
   }

   const section=document.createElement("div");
   section.className="category";

   const title=document.createElement("div");
   title.className="category-title";

   const heading=document.createElement("h2");
   heading.textContent=safeText(category.category);

   title.appendChild(heading);
   section.appendChild(title);

   const grid=document.createElement("div");
   grid.className="products";

   category.plans.forEach(plan=>{

    if(!plan || !plan.name){
     return;
    }

    grid.appendChild(createPlanCard(plan));
    totalPlans++;

   });

   if(grid.children.length>0){
    section.appendChild(grid);
    container.appendChild(section);
   }

  });

  if(totalPlans===0){
   container.innerHTML='<div class="status">No hosting plans available.</div>';
  }

 }catch(error){

  console.error("OGHOST PRODUCT ERROR:",error);

  showError(error.message);

 }

}

loadProducts();
</script>

</body>
</html>
